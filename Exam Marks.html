<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Marks</title>

    <link rel="stylesheet" href="Exam marks style.css">
</head>
<body>
    
    <header>
        <h2 class="logo">CAREERLINK</h2>
        <nav class="navigation">
            <p>Career & Academic Path System</p>
        </nav>
    </header>

    <section class="guide">
        <h1>Enter your exam marks</h1>
        <p>
        Please provide your recent exam results (0-100) for at least 3 subjects
        </p>
    </section>

    <section class="container">
        <div class="mark">
            <p>Bahasa Melayu</p>
            <input type="text" placeholder="0-100" class="score">    
        </div>
        <div class="mark">
            <p>Bahasa Inggeris</p>
            <input type="text" placeholder="0-100" class="score">    
        </div>
        <div class="mark">
            <p>Matematik</p>
            <input type="text" placeholder="0-100" class="score">    
        </div>
        <div class="mark">
            <p>Sejarah</p>
            <input type="text" placeholder="0-100" class="score">    
        </div>
        <div class="mark">
            <p>Sains</p>
            <input type="text" placeholder="0-100" class="score">    
        </div>
        <div class="mark">
            <p>Pendidikan Islam</p>
            <input type="text" placeholder="0-100" class="score">    
        </div>
        <div class="mark">
            <p>Pendidikan Moral</p>
            <input type="text" placeholder="0-100" class="score">    
        </div>
        <div class="mark">
            <p>Asas Sains Komputer</p>
            <input type="text" placeholder="0-100" class="score">    
        </div>
        <div class="mark">
            <p>Reka Bentuk Teknologi</p>
            <input type="text" placeholder="0-100" class="score">    
        </div>      
    </section>

    <section class="button">
        <button class="back-btn"
            onclick="window.location.href='career assesment.html'">
            Back
        </button>
        <button class="continue-btn"
            onclick="window.location.href='Personal information.html'">
            Continue 
        </button>
    </section>

</body>
</html>
