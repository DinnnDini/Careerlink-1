<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Information</title>
    <link rel="stylesheet" href="personal information style.css">
</head>
<body>

    <header>
        <h2 class="logo">CAREERLINK</h2>
        <nav>
            <p>Career & Academic Path System</p>
        </nav>
    </header>

    <section class="guide">
        <h1>Personal Information</h1>
        <p>
        Please provide your personal details below
        </p>
    </section>



    <main class="container">
        <div class="form-box register">
            <form action="#">
                <div class="input-box">
                    <input type="text" required>
                    <label>Full Name</label>
                    <ion-icon name="person-outline" class="icon"></ion-icon>
                </div>
                <div class="input-box">
                    <input type="email" required>
                    <label>Email Address</label>
                    <ion-icon name="mail-outline" class="icon"></ion-icon>
                </div>
                <div class="input-box">
                    <input type="date" required>
                    <label class="date-label">Date of Birth</label>
                </div>
                <button type="submit" class="btn">Submit Information</button>
            </form>
        </div>
    </main>

    <script type="module" src="[unpkg.com](https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js)"></script>
    <script nomodule src="[unpkg.com](https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js)"></script>
    
</body>
</html>
